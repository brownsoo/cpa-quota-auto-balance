name: Build and Release CPA Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            runner: macos-14
            ext: dylib
          - goos: darwin
            goarch: amd64
            runner: macos-13
            ext: dylib
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            ext: so
          - goos: windows
            goarch: amd64
            runner: windows-latest
            ext: dll

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Tests
        run: go test -v ./...

      - name: Build Shared Library
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -buildmode=c-shared -trimpath -ldflags="-s -w" -o dist/quota-auto-balance-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.ext }} .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quota-auto-balance-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/quota-auto-balance-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.ext }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
