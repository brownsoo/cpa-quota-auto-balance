name: Build and Release CPA Plugin

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  test-ui:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Dashboard XSS Regression Tests
        run: node --test ui_template_test.mjs

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            ext: dylib
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            ext: dylib
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            ext: so
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            ext: so
          - goos: windows
            goarch: amd64
            runner: windows-latest
            ext: dll
          - goos: windows
            goarch: arm64
            runner: windows-11-arm
            ext: dll

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up llvm-mingw for Windows ARM64
        if: matrix.goos == 'windows' && matrix.goarch == 'arm64'
        shell: pwsh
        run: |
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20261117/llvm-mingw-20261117-ucrt-aarch64.zip"
          $zip = "$env:RUNNER_TEMP\llvm-mingw.zip"
          $dest = "$env:RUNNER_TEMP\llvm-mingw"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $binDir = (Get-ChildItem -Path $dest -Directory | Select-Object -First 1).FullName + "\bin"
          "$binDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CC=aarch64-w64-mingw32-gcc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Tests
        env:
          CGO_ENABLED: '1'
        run: go test -v ./...

      - name: Build and Package Plugin Archive
        shell: bash
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            VERSION="0.1.1"
          fi
          mkdir -p build dist
          LIB_NAME="quota-auto-balance.${EXT}"
          ZIP_NAME="quota-auto-balance_${VERSION}_${GOOS}_${GOARCH}.zip"
          go build -buildmode=c-shared -trimpath -ldflags="-s -w" -o "build/${LIB_NAME}" .
          cd build
          if command -v zip >/dev/null 2>&1; then
            zip "../dist/${ZIP_NAME}" "${LIB_NAME}"
          else
            powershell.exe -NoProfile -Command "Compress-Archive -Path '${LIB_NAME}' -DestinationPath '../dist/${ZIP_NAME}' -Force"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quota-auto-balance-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: [test-ui, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify Six-Platform Matrix and Generate checksums.txt
        run: |
          cd release-assets
          VERSION="${GITHUB_REF_NAME#v}"
          for target in darwin_arm64 darwin_amd64 linux_amd64 linux_arm64 windows_amd64 windows_arm64; do
            FILE="quota-auto-balance_${VERSION}_${target}.zip"
            if [ ! -f "$FILE" ]; then
              echo "Missing required platform archive: $FILE"
              exit 1
            fi
          done
          sha256sum *.zip > checksums.txt
          sha256sum -c checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.zip
            release-assets/checksums.txt
          generate_release_notes: true
